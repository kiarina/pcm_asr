name: pcm_asr
description: >-
  Final transcription of finalized PCM segments with the OS speech engine.
  The caller owns the microphone; this plugin only turns one finished
  segment into final text. (Working name; not published.)
version: 0.0.1
publish_to: none
repository: https://github.com/kiarina/pcm_asr
issue_tracker: https://github.com/kiarina/pcm_asr/issues

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  # Windows backend (whisper.cpp through dart:ffi)
  crypto: ^3.0.6
  ffi: ^2.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PcmAsrPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: PcmAsrPlugin
        sharedDarwinSource: true
      android:
        package: jp.kiarina.pcm_asr
        pluginClass: PcmAsrPlugin
      web:
        pluginClass: PcmAsrWeb
        fileName: pcm_asr_web.dart
      windows:
        dartPluginClass: PcmAsrWindows
        fileName: pcm_asr_windows.dart
        ffiPlugin: true
