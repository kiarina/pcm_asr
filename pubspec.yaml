name: pcm_asr
description: >-
  Final transcription of finalized PCM segments with the OS speech engine
  (SpeechAnalyzer, Android SpeechRecognizer, Web Speech) or whisper.cpp on Windows.
version: 0.1.2
repository: https://github.com/kiarina/pcm_asr
issue_tracker: https://github.com/kiarina/pcm_asr/issues
topics:
  - speech-recognition
  - speech-to-text
  - asr
  - audio
  - whisper

environment:
  sdk: ^3.13.2
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1
  # Windows backend (whisper.cpp through dart:ffi)
  crypto: ^3.0.6
  ffi: ^2.1.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PcmAsrPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: PcmAsrPlugin
        sharedDarwinSource: true
      android:
        package: jp.kiarina.pcm_asr
        pluginClass: PcmAsrPlugin
      web:
        pluginClass: PcmAsrWeb
        fileName: pcm_asr_web.dart
      windows:
        dartPluginClass: PcmAsrWindows
        ffiPlugin: true
