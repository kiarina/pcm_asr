name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # The root analyze also sees example/, whose pubspec lists the fixture asset directory.
      - run: mkdir -p example/assets/segments && echo '[]' > example/assets/segments/segments.json
      - run: flutter analyze
      - run: flutter test
      - run: cd example && flutter pub get && flutter analyze

  build-android-web:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: mkdir -p example/assets/segments && echo '[]' > example/assets/segments/segments.json
      - run: cd example && flutter build apk --debug
      - run: cd example && flutter build web --release

  build-apple:
    # SpeechAnalyzer needs the macOS 26 / iOS 26 SDK (Xcode 26).
    runs-on: macos-26
    needs: analyze
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: mkdir -p example/assets/segments && echo '[]' > example/assets/segments/segments.json
      - run: cd example && flutter build macos --release
      - run: cd example && flutter build ios --release --no-codesign

  build-windows:
    # CPU-only whisper.cpp (no Vulkan SDK on the runner).
    runs-on: windows-latest
    needs: analyze
    env:
      PCM_ASR_VULKAN: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: powershell -ExecutionPolicy Bypass -File tool/fetch_whisper_cpp.ps1
      - run: New-Item -ItemType Directory -Force example/assets/segments | Out-Null; Set-Content example/assets/segments/segments.json '[]'
      - run: cd example; flutter build windows --release
